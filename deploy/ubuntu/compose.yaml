name: uts-cwpp-ubuntu

services:
  database:
    image: postgres:17-alpine
    container_name: uts-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: uts_academico
      POSTGRES_USER: uts_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Ejecuta python3 scripts/preparar_ubuntu.py}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - uts_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uts_user -d uts_academico"]
      interval: 10s
      timeout: 5s
      retries: 5

  portal:
    build: ./app/backend
    image: uts-cwpp-portal:local
    container_name: uts-portal
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    environment:
      DB_HOST: database
      DB_NAME: uts_academico
      DB_USER: uts_user
      DB_PASSWORD: ${DB_PASSWORD:?Ejecuta python3 scripts/preparar_ubuntu.py}
      PORTAL_SECRET_KEY: ${PORTAL_SECRET_KEY:?Ejecuta python3 scripts/preparar_ubuntu.py}
      PORTAL_USERS_B64: ${PORTAL_USERS_B64:?Ejecuta python3 scripts/preparar_ubuntu.py}
      PORTAL_AUDIT_FILE: /var/log/uts/audit.jsonl
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - uts_internal
      - portal_access
    volumes:
      - audit_logs:/var/log/uts

networks:
  uts_internal:
    driver: bridge
    internal: true
  portal_access:
    driver: bridge

volumes:
  postgres_data:
  audit_logs:
