  portal:
    build: ./app/backend
    container_name: uts-portal
    restart: unless-stopped

    environment:
      DB_HOST: database
      POSTGRES_DB: uts_academico
      POSTGRES_USER: uts_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD}

    ports:
      - "127.0.0.1:8080:8080"

    depends_on:
      database:
        condition: service_healthy

    networks:
      - uts_internal