<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura implementada del portal UTS</title>
  <desc id="desc">El navegador de Windows entra por localhost al portal Flask y Gunicorn. El portal consulta PostgreSQL por una red Docker interna. PostgreSQL conserva datos en un volumen y el portal emite logs JSON.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52718c"/>
    </marker>
    <style>
      .bg { fill: #f7fafc; }
      .title { font: 700 30px Arial, sans-serif; fill: #172337; }
      .subtitle { font: 16px Arial, sans-serif; fill: #526174; }
      .group { fill: none; stroke: #c9d6e4; stroke-width: 2; stroke-dasharray: 8 7; rx: 20; }
      .group-label { font: 700 16px Arial, sans-serif; fill: #53677d; }
      .card { fill: #fff; stroke: #c6d4e2; stroke-width: 2; rx: 16; }
      .browser { fill: #eaf3ff; stroke: #6b9bd1; }
      .portal { fill: #e8f6ed; stroke: #62aa7b; }
      .database { fill: #fff1e1; stroke: #cf995b; }
      .network { fill: #f1edff; stroke: #9481c8; }
      .storage { fill: #fff8e4; stroke: #bfaa5b; }
      .logs { fill: #edf4f7; stroke: #7b9daf; }
      .card-title { font: 700 19px Arial, sans-serif; fill: #172337; }
      .card-detail { font: 14px Arial, sans-serif; fill: #43576b; }
      .label { font: 14px Arial, sans-serif; fill: #43576b; }
      .arrow { fill: none; stroke: #52718c; stroke-width: 3; marker-end: url(#arrow); }
      .footer { font: 15px Arial, sans-serif; fill: #43576b; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="660"/>
  <text class="title" x="48" y="58">Arquitectura implementada · Portal UTS</text>
  <text class="subtitle" x="48" y="88">Despliegue local en Docker Desktop · componentes comprobados</text>

  <rect class="group" x="243" y="150" width="930" height="445"/>
  <text class="group-label" x="265" y="178">Docker Desktop (Linux / WSL 2)</text>

  <rect class="card browser" x="38" y="272" width="170" height="120"/>
  <text class="card-title" x="123" y="314" text-anchor="middle">Windows</text>
  <text class="card-detail" x="123" y="343" text-anchor="middle">Navegador</text>
  <text class="card-detail" x="123" y="368" text-anchor="middle">localhost:8080</text>

  <rect class="card network" x="270" y="272" width="170" height="120"/>
  <text class="card-title" x="355" y="310" text-anchor="middle">portal_access</text>
  <text class="card-detail" x="355" y="340" text-anchor="middle">Red de entrada</text>
  <text class="card-detail" x="355" y="364" text-anchor="middle">Puerto local 8080</text>

  <rect class="card portal" x="495" y="248" width="205" height="165"/>
  <text class="card-title" x="598" y="291" text-anchor="middle">uts-portal</text>
  <text class="card-detail" x="598" y="322" text-anchor="middle">Flask + Gunicorn</text>
  <text class="card-detail" x="598" y="348" text-anchor="middle">UID 10001</text>
  <text class="card-detail" x="598" y="374" text-anchor="middle">Raíz de solo lectura</text>

  <rect class="card network" x="755" y="272" width="175" height="120"/>
  <text class="card-title" x="842" y="310" text-anchor="middle">uts_internal</text>
  <text class="card-detail" x="842" y="340" text-anchor="middle">Red Docker</text>
  <text class="card-detail" x="842" y="364" text-anchor="middle">internal: true</text>

  <rect class="card database" x="985" y="272" width="165" height="120"/>
  <text class="card-title" x="1067" y="310" text-anchor="middle">uts-database</text>
  <text class="card-detail" x="1067" y="340" text-anchor="middle">PostgreSQL 17</text>
  <text class="card-detail" x="1067" y="364" text-anchor="middle">Puerto 5432</text>

  <path class="arrow" d="M 208 332 H 265"/>
  <path class="arrow" d="M 440 332 H 490"/>
  <path class="arrow" d="M 700 332 H 750"/>
  <path class="arrow" d="M 930 332 H 980"/>
  <text class="label" x="842" y="252" text-anchor="middle">DNS: database:5432</text>

  <rect class="card logs" x="505" y="463" width="185" height="95"/>
  <text class="card-title" x="598" y="499" text-anchor="middle">Logs JSON</text>
  <text class="card-detail" x="598" y="527" text-anchor="middle">docker compose logs</text>
  <path class="arrow" d="M 598 413 V 458"/>

  <rect class="card storage" x="985" y="463" width="165" height="95"/>
  <text class="card-title" x="1067" y="499" text-anchor="middle">postgres_data</text>
  <text class="card-detail" x="1067" y="527" text-anchor="middle">Volumen persistente</text>
  <path class="arrow" d="M 1067 392 V 458"/>

  <text class="footer" x="48" y="626">Estado verificado: portal y base saludables · 20 estudiantes · 7 cursos · 60 matrículas</text>
</svg>
