<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura general propuesta para la UTS</title>
  <desc id="desc">Usuarios acceden al portal, que consulta PostgreSQL. La auditoría del portal y las alertas de Falco alimentan Wazuh manager. Una capa de visualización central se identifica como ampliación futura.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#476580"/></marker>
    <style>
      .bg{fill:#f7fafc}.title{font:700 31px Arial,sans-serif;fill:#192d43}.sub{font:16px Arial,sans-serif;fill:#4a6277}
      .group{fill:#fff;stroke:#adc3d5;stroke-width:2;rx:20}.card{stroke-width:2;rx:14}.user{fill:#e5f0ff;stroke:#6691c8}.portal{fill:#e2f5e8;stroke:#5ca279}.db{fill:#fff0dd;stroke:#cc9556}.log{fill:#f0eaff;stroke:#927cc0}.sensor{fill:#e7f4fa;stroke:#5b9cab}.wazuh{fill:#e4f3f8;stroke:#5c99ac}.future{fill:#f5f7f7;stroke:#a8b5bd;stroke-dasharray:7 7}
      .h{font:700 19px Arial,sans-serif;fill:#1c3448}.d{font:15px Arial,sans-serif;fill:#355269}.label{font:14px Arial,sans-serif;fill:#4a6277}.line{fill:none;stroke:#476580;stroke-width:3;marker-end:url(#arrow)}.dashed{stroke-dasharray:8 7}
    </style>
  </defs>
  <rect class="bg" width="1400" height="800"/>
  <text class="title" x="45" y="55">UTS · arquitectura general propuesta</text>
  <text class="sub" x="45" y="85">Servicio académico, dos fuentes de eventos y análisis central</text>

  <rect class="group" x="45" y="140" width="1310" height="242"/>
  <text class="h" x="75" y="175">Servicio académico</text>
  <rect class="card user" x="80" y="215" width="235" height="120"/>
  <text class="h" x="198" y="255" text-anchor="middle">Usuarios</text>
  <text class="d" x="198" y="286" text-anchor="middle">Roles académicos</text>
  <text class="d" x="198" y="312" text-anchor="middle">Navegador</text>
  <rect class="card portal" x="465" y="215" width="300" height="120"/>
  <text class="h" x="615" y="255" text-anchor="middle">Portal académico</text>
  <text class="d" x="615" y="286" text-anchor="middle">Autenticación y permisos</text>
  <text class="d" x="615" y="312" text-anchor="middle">Aplicación en contenedor</text>
  <rect class="card db" x="925" y="215" width="330" height="120"/>
  <text class="h" x="1090" y="255" text-anchor="middle">Base de datos</text>
  <text class="d" x="1090" y="286" text-anchor="middle">PostgreSQL separado</text>
  <text class="d" x="1090" y="312" text-anchor="middle">Datos ficticios persistentes</text>
  <path class="line" d="M315 275 H459"/><path class="line" d="M765 275 H919"/>
  <text class="label" x="843" y="202" text-anchor="middle">Consultas por red interna</text>

  <rect class="group" x="45" y="415" width="1310" height="315"/>
  <text class="h" x="75" y="450">Observación y análisis de seguridad</text>
  <rect class="card log" x="150" y="485" width="260" height="105"/>
  <text class="h" x="280" y="525" text-anchor="middle">Auditoría del portal</text>
  <text class="d" x="280" y="555" text-anchor="middle">Ingreso y acceso denegado</text>
  <rect class="card sensor" x="485" y="485" width="260" height="105"/>
  <text class="h" x="615" y="525" text-anchor="middle">Falco</text>
  <text class="d" x="615" y="555" text-anchor="middle">Procesos y syscalls</text>
  <rect class="card wazuh" x="905" y="485" width="335" height="105"/>
  <text class="h" x="1073" y="525" text-anchor="middle">Wazuh manager</text>
  <text class="d" x="1073" y="555" text-anchor="middle">Reglas y alertas registradas</text>
  <path class="line" d="M565 335 V397 H430 V465 H280 V479"/>
  <path class="line" d="M665 335 V479"/>
  <path class="line" d="M410 538 H450 V605 H860 V535 H899"/>
  <path class="line" d="M745 560 H899"/>
  <text class="label" x="813" y="470" text-anchor="middle">Eventos JSON</text>
  <rect class="card future" x="905" y="620" width="335" height="75"/>
  <text class="h" x="1073" y="652" text-anchor="middle">Indexer + dashboard</text>
  <text class="d" x="1073" y="676" text-anchor="middle">Ampliación futura</text>
  <path class="line dashed" d="M1073 590 V614"/>
  <text class="sub" x="45" y="772">El piloto Ubuntu validó portal → Wazuh y Falco → Wazuh; no desplegó indexer ni dashboard.</text>
</svg>
