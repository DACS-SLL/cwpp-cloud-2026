<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura comprobada en Windows</title>
  <desc id="desc">Portal y PostgreSQL en Docker Desktop. Wazuh se probó en dos sesiones separadas: manager con indexer para alertas y dashboard con indexer para acceso a la interfaz. Falco no observó estos contenedores.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#476580"/></marker>
    <style>
      .bg{fill:#f7fafc}.title{font:700 31px Arial,sans-serif;fill:#192d43}.sub{font:16px Arial,sans-serif;fill:#4a6277}
      .group{fill:#fff;stroke:#adc3d5;stroke-width:2;rx:20}.test{fill:#eef4fa;stroke:#adc3d5;stroke-width:2;rx:18}
      .browser{fill:#e5f0ff;stroke:#6691c8}.portal{fill:#e2f5e8;stroke:#5ca279}.db{fill:#fff0dd;stroke:#cc9556}.volume{fill:#f0eaff;stroke:#927cc0}.wazuh{fill:#e4f3f8;stroke:#5c99ac}.card{stroke-width:2;rx:14}
      .h{font:700 19px Arial,sans-serif;fill:#1c3448}.d{font:15px Arial,sans-serif;fill:#355269}.label{font:14px Arial,sans-serif;fill:#4a6277}.line{fill:none;stroke:#476580;stroke-width:3;marker-end:url(#arrow)}.dash{stroke-dasharray:8 6}
    </style>
  </defs>
  <rect class="bg" width="1400" height="800"/>
  <text class="title" x="45" y="55">PC Windows · Docker Desktop</text>
  <text class="sub" x="45" y="85">Estado histórico comprobado: aplicación, base y pruebas Wazuh en sesiones separadas</text>
  <rect class="group" x="285" y="135" width="1060" height="310"/>
  <text class="h" x="315" y="175">Docker Desktop / WSL 2</text>
  <rect class="card browser" x="40" y="228" width="195" height="115"/>
  <text class="h" x="138" y="270" text-anchor="middle">Navegador</text><text class="d" x="138" y="299" text-anchor="middle">localhost:8080</text>
  <rect class="card portal" x="335" y="220" width="240" height="130"/>
  <text class="h" x="455" y="262" text-anchor="middle">uts-portal</text><text class="d" x="455" y="290" text-anchor="middle">Flask · UID 10001</text><text class="d" x="455" y="317" text-anchor="middle">portal_access</text>
  <rect class="card db" x="665" y="220" width="245" height="130"/>
  <text class="h" x="788" y="262" text-anchor="middle">uts-database</text><text class="d" x="788" y="290" text-anchor="middle">PostgreSQL 17</text><text class="d" x="788" y="317" text-anchor="middle">uts_internal</text>
  <rect class="card volume" x="1015" y="220" width="280" height="130"/>
  <text class="h" x="1155" y="262" text-anchor="middle">audit_logs</text><text class="d" x="1155" y="290" text-anchor="middle">Eventos JSON del portal</text><text class="d" x="1155" y="317" text-anchor="middle">Volumen persistente</text>
  <path class="line" d="M235 285 H329"/><path class="line" d="M575 285 H659"/><path class="line" d="M455 350 V395 H1155 V356"/>
  <text class="label" x="622" y="207" text-anchor="middle">database:5432</text>
  <text class="label" x="825" y="385" text-anchor="middle">auditoría del portal</text>
  <rect class="test" x="65" y="505" width="590" height="205"/>
  <text class="h" x="90" y="540">Prueba A · Detección</text>
  <rect class="card wazuh" x="90" y="565" width="250" height="105"/>
  <text class="h" x="215" y="605" text-anchor="middle">Wazuh manager</text><text class="d" x="215" y="635" text-anchor="middle">Reglas 100100 / 100101</text>
  <rect class="card wazuh" x="380" y="565" width="245" height="105"/>
  <text class="h" x="502" y="605" text-anchor="middle">Indexer</text><text class="d" x="502" y="635" text-anchor="middle">Servicio activo</text>
  <rect class="test" x="745" y="505" width="590" height="205"/>
  <text class="h" x="770" y="540">Prueba B · Interfaz</text>
  <rect class="card wazuh" x="770" y="565" width="245" height="105"/>
  <text class="h" x="892" y="605" text-anchor="middle">Indexer</text><text class="d" x="892" y="635" text-anchor="middle">Arranque separado</text>
  <rect class="card wazuh" x="1055" y="565" width="250" height="105"/>
  <text class="h" x="1180" y="605" text-anchor="middle">Dashboard</text><text class="d" x="1180" y="635" text-anchor="middle">API manager offline</text>
  <path class="line" d="M1015 618 H1049"/>
  <path class="line dash" d="M1155 350 V475 H215 V499"/>
  <text class="label" x="698" y="469" text-anchor="middle">Lectura del volumen en la prueba A</text>
  <text class="sub" x="45" y="764">No hubo manager + indexer + dashboard simultáneos. Falco no se validó sobre Docker Desktop.</text>
</svg>
