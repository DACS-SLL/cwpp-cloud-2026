<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ titulo }} | Portal académico UTS</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 3rem auto; padding: 0 1rem; color: #172337; }
    a { color: #075a9c; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border-bottom: 1px solid #d7dce2; padding: .65rem; text-align: left; }
    th { background: #eef3f8; }
    .table-wrap { overflow-x: auto; }
  </style>
</head>
<body>
  <p><a href="{{ url_for('index') }}">← Inicio</a> · {{ session['user'] }} ({{ session['role'] }})</p>
  <h1>{{ titulo }}</h1>
  <p>{{ filas|length }} registros</p>
  <div class="table-wrap">
    <table>
      <thead><tr>{% for encabezado in encabezados %}<th scope="col">{{ encabezado }}</th>{% endfor %}</tr></thead>
      <tbody>
        {% for fila in filas %}
        <tr>{% for valor in fila %}<td>{{ valor if valor is not none else '—' }}</td>{% endfor %}</tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
