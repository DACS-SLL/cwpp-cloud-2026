<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingreso | Portal académico UTS</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 3rem auto; padding: 0 1rem; color: #172337; }
    label, input { display: block; width: 100%; box-sizing: border-box; }
    label { margin-top: 1rem; }
    input { padding: .6rem; }
    button { margin-top: 1.5rem; padding: .65rem 1rem; }
    .error { color: #a21d26; }
  </style>
</head>
<body>
  <p><a href="{{ url_for('index') }}">← Inicio</a></p>
  <h1>Ingresar</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label for="username">Usuario</label>
    <input id="username" name="username" autocomplete="username" required>
    <label for="password">Contraseña</label>
    <input id="password" type="password" name="password" autocomplete="current-password" required>
    <button type="submit">Ingresar</button>
  </form>
</body>
</html>
